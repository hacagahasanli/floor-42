// ---------------------------------------------------------------- rig building
const hex = (h) => new THREE.Color(h);
const matCache = new Map();
const M = (c) => { const k = String(c); if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color: hex(c), flatShading: true, roughness: 0.85, metalness: 0.04 })); return matCache.get(k); };
const box = (w, h, d, c) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c));
const ico = (r, c, det = 1) => new THREE.Mesh(new THREE.IcosahedronGeometry(r, det), M(c));
const cyl = (r, h, c, seg = 8, r2 = r) => new THREE.Mesh(new THREE.CylinderGeometry(r2, r, h, seg), M(c));
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };
const G = () => new THREE.Group();

const SPEC = {
  kessa: { legLen: 0.9, legR: 0.085, torsoW: 0.5, torsoH: 0.66, torsoD: 0.32, headR: 0.19, armLen: 0.78, armR: 0.07,
    skin: '#C68A63', top: '#E5392F', pants: '#1B1F2E', shoes: '#FFFAF0' },
  ormo: { legLen: 0.55, legR: 0.15, torsoW: 0.95, torsoH: 0.75, torsoD: 0.55, headR: 0.23, armLen: 0.62, armR: 0.12,
    skin: '#E9B48F', top: '#14A37F', pants: '#5A4A3A', shoes: '#4A3426', sleeve: '#F3EBDD' },
  zuzu: { legLen: 0.45, legR: 0.085, torsoW: 0.48, torsoH: 0.45, torsoD: 0.3, headR: 0.21, armLen: 0.48, armR: 0.065,
    skin: '#8D5A3B', top: '#F25CB8', pants: '#1B1F2E', shoes: '#FFC93C', sock: '#FFFAF0' },
  tavo: { legLen: 0.7, legR: 0.1, torsoW: 0.52, torsoH: 0.55, torsoD: 0.32, headR: 0.19, armLen: 0.6, armR: 0.075,
    skin: '#F1C7A0', top: '#2456D6', pants: '#8C7A55', shoes: '#5A4130' },
};

function buildRig(id) {
  const s = SPEC[id];
  const root = G(), hips = G(), torso = G(), head = G();
  root.add(hips); hips.position.y = s.legLen; hips.add(torso);
  // torso
  torso.add(at(box(s.torsoW, s.torsoH, s.torsoD, s.top), 0, s.torsoH / 2, 0));
  torso.add(at(box(s.torsoW * 0.96, 0.12, s.torsoD * 0.96, s.pants), 0, 0.02, 0));
  // head
  torso.add(head); head.position.y = s.torsoH + s.headR * 0.95;
  head.add(at(cyl(s.headR * 0.42, 0.14, s.skin, 6), 0, -s.headR * 0.85, 0));
  head.add(ico(s.headR, s.skin, 1));
  for (const sx of [-1, 1]) head.add(at(box(0.045, 0.065, 0.02, '#1B1F2E'), sx * s.headR * 0.36, 0.03, s.headR * 0.93));
  // limbs
  const limbs = {};
  for (const [side, sx] of [['L', 1], ['R', -1]]) {
    const sh = G(); sh.position.set(sx * (s.torsoW / 2 + s.armR * 0.9), s.torsoH - s.armR * 1.2, 0); torso.add(sh);
    const u = s.armLen * 0.5;
    sh.add(at(cyl(s.armR, u, s.sleeve || s.top, 7), 0, -u / 2, 0));
    const el = G(); el.position.y = -u; sh.add(el);
    el.add(at(cyl(s.armR * 0.9, u, s.sleeve ? s.skin : s.top, 7), 0, -u / 2, 0));
    el.add(at(ico(s.armR * 1.25, s.skin, 0), 0, -u - 0.02, 0));
    const hand = G(); hand.position.y = -u - 0.03; el.add(hand);
    const hip = G(); hip.position.set(sx * s.torsoW * 0.24, 0, 0); hips.add(hip);
    const t = s.legLen * 0.5;
    hip.add(at(cyl(s.legR, t, s.pants, 7), 0, -t / 2, 0));
    const kn = G(); kn.position.y = -t; hip.add(kn);
    kn.add(at(cyl(s.legR * 0.92, t, s.sock && id === 'zuzu' ? s.skin : s.pants, 7), 0, -t / 2, 0));
    if (id === 'zuzu') { kn.add(at(cyl(s.legR * 0.98, t * 0.55, s.sock, 7), 0, -t * 0.62, 0)); kn.add(at(cyl(s.legR, 0.035, s.top, 7), 0, -t * 0.36, 0)); }
    kn.add(at(box(s.legR * 2.3, 0.1, s.legR * 3.6, s.shoes), 0, -t - 0.0, s.legR * 0.7));
    limbs['arm' + side] = sh; limbs['fore' + side] = el; limbs['hand' + side] = hand; limbs['leg' + side] = hip; limbs['shin' + side] = kn;
  }
  const rig = { id, s, root, hips, torso, head, ...limbs, extra: {} };
  EXTRAS[id](rig);
  return rig;
}

const EXTRAS = {
  kessa(r) {
    const { s, head, torso } = r;
    // short bob hair cap + cream sweatband
    const hair = ico(s.headR * 1.1, '#2A1A14', 1); hair.scale.set(1.02, 0.86, 1.02); hair.position.set(0, 0.07, -0.04); head.add(hair);
    const band = cyl(s.headR * 1.04, 0.055, '#FFF1DC', 10); band.position.y = 0.125; head.add(band);
    // side stripe on the leggings
    for (const k of ['legL', 'legR']) r[k].add(at(box(0.02, s.legLen * 0.48, 0.02, '#FFF1DC'), (k === 'legL' ? 1 : -1) * s.legR, -s.legLen * 0.25, 0));
    // the scarf: a collar ring plus two tails made of chained segments
    const collar = cyl(s.headR * 0.78, 0.1, '#E5392F', 10); collar.position.y = s.torsoH + 0.03; torso.add(collar);
    const tails = [];
    for (const [i, off] of [[0, 0.07], [1, -0.07]]) {
      const base = G(); base.position.set(off, s.torsoH + 0.02, -s.torsoD / 2 - 0.02); torso.add(base);
      let parent = base; const segs = [];
      const n = i === 0 ? 6 : 5;
      for (let k = 0; k < n; k++) {
        const g = G(); parent.add(g); if (k) g.position.y = -0.21;
        g.add(at(box(0.2, 0.22, 0.07, k % 2 ? '#FFF1DC' : '#E5392F'), 0, -0.1, 0));
        segs.push(g); parent = g;
      }
      tails.push(segs);
    }
    r.extra.scarf = tails;
  },
  ormo(r) {
    const { s, head, torso } = r;
    // shirt panel under the vest, collar
    torso.add(at(box(0.3, s.torsoH * 0.92, 0.04, s.sleeve), 0, s.torsoH / 2, s.torsoD / 2));
    for (let i = 0; i < 3; i++) torso.add(at(cyl(0.025, 0.02, '#1B1F2E', 6), 0, 0.18 + i * 0.18, s.torsoD / 2 + 0.03).rotateX(Math.PI / 2));
    const belly = ico(0.34, '#14A37F', 1); belly.scale.set(1.12, 0.8, 0.3); belly.position.set(0, 0.25, s.torsoD / 2 + 0.0); torso.add(belly);
    // bald head, grey sides, bushy brows
    for (const sx of [-1, 1]) { const sd = ico(0.1, '#B8B0A4', 0); sd.scale.set(0.6, 1, 1.3); sd.position.set(sx * s.headR * 0.9, 0.0, -0.05); head.add(sd); }
    for (const sx of [-1, 1]) head.add(at(box(0.12, 0.04, 0.05, '#4A2E22'), sx * s.headR * 0.4, 0.1, s.headR * 0.92));
    // THE moustache: a wide bar with curled tips, wider than the head
    const tache = G(); tache.position.set(0, -0.05, s.headR * 0.93); head.add(tache);
    tache.add(at(box(0.26, 0.085, 0.09, '#4A2E22'), 0, 0, 0));
    for (const sx of [-1, 1]) {
      const arm = box(0.2, 0.07, 0.08, '#4A2E22'); arm.position.set(sx * 0.21, 0.02, -0.02); arm.rotation.z = sx * 0.28; tache.add(arm);
      const tip = ico(0.055, '#4A2E22', 0); tip.position.set(sx * 0.32, 0.08, -0.03); tache.add(tip);
    }
    head.add(at(ico(0.05, s.skin, 0), 0, 0.0, s.headR * 1.02));
    // thermos on the right hip
    const th = G(); th.position.set(-s.torsoW / 2 - 0.02, 0.12, 0.05); torso.add(th);
    th.add(cyl(0.07, 0.3, '#C9CED8', 8)); th.add(at(cyl(0.075, 0.07, '#E5392F', 8), 0, 0.18, 0));
    r.extra.thermos = th;
  },
  zuzu(r) {
    const { s, head, torso } = r;
    const cap = ico(s.headR * 1.05, '#2B2230', 1); cap.scale.set(1, 0.7, 1); cap.position.set(0, 0.07, -0.02); head.add(cap);
    for (const sx of [-1, 1]) { const p = ico(0.19, '#2B2230', 1); p.position.set(sx * 0.2, 0.25, -0.02); head.add(p); }
    for (const sx of [-1, 1]) head.add(at(box(0.04, 0.04, 0.04, '#F25CB8'), sx * 0.12, 0.17, 0.05));
    // lanyard + whistle
    for (const sx of [-1, 1]) torso.add(at(box(0.025, 0.24, 0.02, '#FFC93C'), sx * 0.08, s.torsoH - 0.12, s.torsoD / 2 + 0.01));

  tavo(r) {
    const { s, head, torso } = r;

    // pockets on cargo pants
    for (const k of ['legL', 'legR']) r[k].add(at(box(0.05, 0.12, 0.12, '#7A6A47'), (k === 'legL' ? 1 : -1) * (s.legR + 0.01), -0.22, 0));
    // THE pack: tall, orange, with a rolled mat on top and a mug
    const pack = G(); pack.position.set(0, 0.0, -s.torsoD / 2 - 0.22); torso.add(pack);
    pack.add(at(box(0.62, 0.98, 0.42, '#F08A24'), 0, 0.5, 0));
    pack.add(at(box(0.5, 0.3, 0.08, '#C96E16'), 0, 0.82, 0.2));
    pack.add(at(box(0.44, 0.3, 0.1, '#C96E16'), 0, 0.28, -0.22));
    for (const sx of [-1, 1]) pack.add(at(box(0.1, 0.32, 0.26, '#C96E16'), sx * 0.36, 0.35, 0));
    const mat = cyl(0.13, 0.78, '#3F7A4A', 9); mat.rotation.z = Math.PI / 2; mat.position.set(0, 1.11, 0); pack.add(mat);
    for (const sx of [-1, 1]) { const b = cyl(0.135, 0.05, '#2C2C2C', 9); b.rotation.z = Math.PI / 2; b.position.set(sx * 0.22, 1.11, 0); pack.add(b); }
    const mug = cyl(0.06, 0.1, '#FFFAF0', 8); mug.position.set(0.41, 0.1, 0.05); pack.add(mug);
    r.extra.pack = pack;
  },
};

    victory: { root: { y: 0.16 }, torso: { x: -8 }, head: { x: -14 }, armR: { x: -172, z: -6 }, foreR: { x: -4 }, armL: { x: -5, z: 42 }, foreL: { x: -105 },
      legL: { x: -72, z: 4 }, shinL: { x: 85 }, legR: { x: 6 }, shinR: { x: 6 }, scarf: { lift: 88, wave: 16 } },
    defeat: { root: { y: -0.42 }, torso: { x: 14 }, head: { x: 24 }, armL: { x: -25, z: 140 }, foreL: { z: 112 }, armR: { x: -25, z: -140 }, foreR: { z: -112 },
      legL: { x: -88 }, shinL: { x: 88 }, legR: { x: 0 }, shinR: { x: 92 }, scarf: { lift: 12, wave: 8 } },
  },
  ormo: {
    idle: { torso: { x: -3 }, armL: { x: 38, z: 8 }, foreL: { x: -72 }, armR: { x: 38, z: -8 }, foreR: { x: -72 }, legL: { z: 4 }, legR: { z: -4 } },

      legL: { z: 24 }, shinL: { x: 6 }, legR: { z: -24 }, shinR: { x: 6 } },
    defeat: { root: { y: 0.17, x: -90, pz: -0.7 }, head: { x: -10, z: 15 }, armL: { z: 75 }, foreL: { x: -10 }, armR: { z: -70 }, foreR: { x: -15 },
      legL: { z: 28 }, legR: { z: -28 } },
  },
  tavo: {
    idle: { torso: { x: 4 }, head: { y: 8 }, armL: { x: -14, z: 6 }, foreL: { x: -118 }, armR: { x: -14, z: -6 }, foreR: { x: -118 },
      legL: { x: -4, z: 3 }, legR: { x: 4, z: -3 } },

      legL: { z: 4 }, legR: { z: -4 }, flag: true, thumb: true },

function applyPose(rig, p) {
  const set = (o, a = {}) => { if (!o) return; o.rotation.set((a.x || 0) * D, (a.y || 0) * D, (a.z || 0) * D); };
  rig.root.rotation.order = 'YXZ';
  rig.root.position.y = p.root?.y || 0;
  if (p.root?.pz) rig.root.userData.pz = p.root.pz;
  rig.root.rotation.x = (p.root?.x || 0) * D;
  for (const k of ['torso', 'head', 'armL', 'foreL', 'armR', 'foreR', 'legL', 'shinL', 'legR', 'shinR']) set(rig[k], p[k]);
  if (rig.extra.scarf) {
    const sc = p.scarf || { lift: 20, wave: 10 };
    rig.extra.scarf.forEach((segs, ti) => segs.forEach((g, k) => {
      g.rotation.x = (k === 0 ? sc.lift : 3 + Math.sin(k * 1.1 + ti * 1.7) * sc.wave * 0.5) * D;
      g.rotation.z = k === 0 ? (ti ? 1 : -1) * 7 * D : 0; g.rotation.y = k === 0 ? (ti ? 1 : -1) * 14 * D : 0;
    }));
  }
  if (rig.id === 'ormo' && p.thermosInHand) {
    const cup = G(); cup.add(cyl(0.075, 0.12, '#E5392F', 8)); cup.position.set(0, -0.06, 0.02); rig.handR.add(cup);
  }
  if (rig.id === 'tavo') {
    if (p.flag) {
      const f = G(); f.add(at(cyl(0.012, 0.55, '#5A4130', 5), 0, -0.1, 0)); const tri = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 3), M('#FFC83D'));
      tri.rotation.z = Math.PI / 2; tri.position.set(-0.15, -0.3, 0); f.add(tri); f.rotation.x = Math.PI; rig.handR.add(f);
    }
    if (p.thumb) rig.handL.add(at(box(0.04, 0.09, 0.04, rig.s.skin), 0, 0.02, 0.05));
    if (p.packOff) {
      const pack = rig.extra.pack; rig.torso.remove(pack); pack.position.set(0.5, 0.22, -0.55); pack.rotation.set(0, 0.3, -1.4); rig.root.add(pack);
      rig.root.add(at(cyl(0.06, 0.1, '#FFFAF0', 8), 0.75, 0.05, 0.2));
      const sw = box(0.18, 0.07, 0.15, '#E9C98F'); sw.position.set(0.6, 0.04, 0.55); sw.rotation.y = 0.6; rig.root.add(sw);
      rig.root.add(at(box(0.16, 0.025, 0.13, '#5FB04A'), 0.6, 0.085, 0.55));
    }
  }
  if (rig.id === 'zuzu' && p.root?.x) { /* whistle rolls off */ }
}

// ---------------------------------------------------------------- rendering
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(1);

function lights(scene, rim) {
  scene.add(new THREE.HemisphereLight('#dff1ff', '#e3bf86', 1.5));
  const sun = new THREE.DirectionalLight('#fff2dc', 2.3); sun.position.set(-3, 6, 5); scene.add(sun);
  const r = new THREE.DirectionalLight(rim, 2.2); r.position.set(4, 3, -5); scene.add(r);
  const fill = new THREE.DirectionalLight('#ffffff', 0.5); fill.position.set(3, 1, 4); scene.add(fill);
}
function blob(scene, x = 0, rx = 0.6) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(rx, 28), new THREE.MeshBasicMaterial({ color: '#3b2a10', transparent: true, opacity: 0.22 }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0.002, 0); m.scale.y = 0.6; scene.add(m);
}
function shot(scene, cam, w, h) {
  renderer.setSize(w, h, false);
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
}
function fighterScene(f, pose, yaw) {
  const scene = new THREE.Scene(); lights(scene, f.tint);
  const rig = buildRig(f.id); applyPose(rig, POSES[f.id][pose]); rig.root.rotation.y = yaw * D; scene.add(rig.root);
  if (rig.root.userData.pz) { const v = new THREE.Vector3(0, 0, rig.root.userData.pz).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw * D); rig.root.position.x -= v.x; rig.root.position.z -= v.z; }
  blob(scene, 0, f.id === 'ormo' ? 0.75 : 0.55);
  return { scene, rig };
}
function heroShot(f, pose, yaw, w, h, fov = 24, dist = 7.2, lookY = 1.0, camUp = 0.6) {
  const { scene } = fighterScene(f, pose, yaw);
  const cam = new THREE.PerspectiveCamera(fov, w / h, 0.1, 50);
  cam.position.set(0, lookY + camUp, dist); cam.lookAt(0, lookY, 0);
  return shot(scene, cam, w, h);
}
// Silhouette at game scale: pxPerM pixels per metre, flat black (or a flat colour), orthographic.
function silhouette(f, yaw, pxPerM, colour = '#000000', pose = 'idle', hM = 2.4, wM = 1.6) {
  const scene = new THREE.Scene();
  const rig = buildRig(f.id); applyPose(rig, POSES[f.id][pose]); rig.root.rotation.y = yaw * D; scene.add(rig.root);
  scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: colour });
  const w = Math.round(wM * pxPerM), h = Math.round(hM * pxPerM);
  const cam = new THREE.OrthographicCamera(-wM / 2, wM / 2, hM, 0, 0.1, 50); cam.position.set(0, 0, 10); cam.lookAt(0, 0, 0);
  // orthographic with top=hM bottom=0 needs the camera at y=0 looking straight: shift frustum instead
  return shot(scene, cam, w, h);
}

  }
