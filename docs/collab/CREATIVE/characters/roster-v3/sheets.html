const hex = (h) => new THREE.Color(h);
const matCache = new Map();
const M = (c) => { const k = String(c); if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color: hex(c), flatShading: true, roughness: 0.85, metalness: 0.04, side: THREE.DoubleSide })); return matCache.get(k); };
const box = (w, h, d, c) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c));
const ico = (r, c, det = 1) => new THREE.Mesh(new THREE.IcosahedronGeometry(r, det), M(c));
const cyl = (r, h, c, seg = 8, r2 = r) => new THREE.Mesh(new THREE.CylinderGeometry(r2, r, h, seg), M(c));
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };
const rot = (o, x = 0, y = 0, z = 0) => { o.rotation.set(x * D, y * D, z * D); return o; };
const G = () => new THREE.Group();
function star(r, c, depth = 0.015) {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) { const a = Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; const x = Math.cos(a) * rr, y = Math.sin(a) * rr; i ? s.lineTo(x, y) : s.moveTo(x, y); }
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false }); g.translate(0, 0, -depth / 2);
  return new THREE.Mesh(g, M(c));
}

function buildRig(id) {
  const s = SPEC[id];

// face: eyes, brows, mouth per expression. Ormo has no mouth (the moustache is his mouth).
function face(rig, expr = 'angry') {
  const { s, head, id } = rig; const r = s.headR;
  const f = G(); f.position.z = r * 0.9; head.add(f);
  const ink = '#1B1F2E';
  const ex = r * 0.37, ey = 0.025;
  for (const sx of [-1, 1]) {
    if (expr === 'ko') { for (const a of [45, -45]) f.add(rot(at(box(0.075, 0.018, 0.02, ink), sx * ex, ey, 0.03), 0, 0, a)); }
    else if (expr === 'closed') f.add(rot(at(box(0.06, 0.016, 0.02, ink), sx * ex, ey - 0.005, 0.03), 0, 0, sx * -8));
    else f.add(at(box(0.042, expr === 'shock' ? 0.075 : 0.06, 0.02, ink), sx * ex, ey, 0.03));
    // brows: +angle on the +x brow lowers its inner end = angry; negative = worried
    const bang = { angry: 20, grin: 14, smug: sx > 0 ? -12 : 16, sad: -20, shock: -6, ko: -10, closed: -4, shout: 26 }[expr];
    const by = { shock: 0.11, sad: 0.095, smug: sx > 0 ? 0.11 : 0.085 }[expr] ?? 0.085;
    f.add(rot(at(box(id === 'ormo' ? 0.11 : 0.085, id === 'ormo' ? 0.032 : 0.026, 0.03, id === 'ormo' ? '#C9C3B8' : (s.brow || '#2A1A14')), sx * ex * 1.02, by + (id === 'ormo' ? 0.01 : 0), 0.035), 0, 0, sx * bang * (id === 'ormo' ? 0.55 : 1)));
  }
  if (id === 'ormo') return f;
  const my = -0.075;
  if (expr === 'grin' || expr === 'smug') {
    f.add(at(box(0.12, 0.05, 0.02, ink), 0, my, 0.025));
    f.add(rot(at(box(0.1, 0.03, 0.02, id === 'brix' ? '#FFC83D' : '#FFFFFF'), 0, my + 0.004, 0.032), 0, 0, expr === 'smug' ? 6 : 0));
  } else if (expr === 'shout' || expr === 'shock') {
    f.add(at(box(expr === 'shout' ? 0.09 : 0.05, expr === 'shout' ? 0.07 : 0.06, 0.02, '#5A1E2A'), 0, my - 0.005, 0.03));
  } else if (expr === 'sad' || expr === 'ko') {
    f.add(rot(at(box(0.05, 0.016, 0.02, ink), -0.022, my, 0.03), 0, 0, 18)); f.add(rot(at(box(0.05, 0.016, 0.02, ink), 0.022, my, 0.03), 0, 0, -18));
  } else if (expr === 'closed') {
    f.add(at(box(0.05, 0.016, 0.02, ink), 0, my, 0.03));
  } else { // angry: a flat hard line
    f.add(at(box(0.085, 0.018, 0.02, ink), 0, my, 0.03));
  }
  return f;
}

function applyPose(rig, p) {
  const set = (o, a = {}) => { if (!o) return; o.rotation.set((a.x || 0) * D, (a.y || 0) * D, (a.z || 0) * D); };

  if (p.root?.pz) rig.root.userData.pz = p.root.pz;
  rig.root.rotation.x = (p.root?.x || 0) * D;
  for (const k of ['torso', 'head', 'armL', 'foreL', 'armR', 'foreR', 'legL', 'shinL', 'legR', 'shinR', 'footL', 'footR']) set(rig[k], p[k]);
  face(rig, p.expr);
  const { s, root, extra } = rig;
  rig.groundItems = rig.groundItems || [];
  // --- Brix
  if (rig.id === 'brix' && p.skateOff) {

    const sk = extra.skates.footR; sk.parent.remove(sk);

    rig.footR.add(at(box(0.14, 0.11, 0.24, '#FFF1DC'), 0, -0.01, 0.05)); rig.footR.add(at(box(0.145, 0.035, 0.245, '#E5392F'), 0, 0.03, 0.05));
    rig.groundItems.push(rot(at(box(0.1, 0.035, 0.05, '#FFC83D'), 0.5, 0.02, 0.7), 0, 40, 0));
  }
  // --- Margo
  if (rig.id === 'margo') {
    if (extra.tails) extra.tails.forEach((t, i) => { t.rotation.x = -(p.tails || 0) * D * (i ? 0.7 : 1); });
    if (p.beltOff) {
      extra.belt.visible = false;

      b.position.set(0, s.torsoH * 0.22, s.torsoD / 2 + 0.36); rig.torso.add(b);

  if (rig.id === 'ormo') {

    if (p.cupInHand) {

      if (p.cupInHand === 'down') { cup.position.set(0, -0.24, 0.06); }

      rig.handR.add(cup);

      extra.thermos.visible = false;
      const t = G(); t.add(cyl(0.07, 0.3, '#C9CED8', 8)); t.rotation.z = Math.PI / 2; t.position.set(-0.85, 0.07, 0.25); t.rotation.y = 0.4; rig.groundItems.push(t);
      const pud = new THREE.Mesh(new THREE.CircleGeometry(0.32, 14), M('#8A5A2B')); pud.rotation.x = -Math.PI / 2; pud.scale.set(1.3, 0.8, 1); pud.position.set(-0.9, 0.006, 0.55); rig.groundItems.push(pud);
      rig.groundItems.push(rot(at(cyl(0.075, 0.07, '#E5392F', 8), -0.5, 0.04, 0.85), 70, 0, 20));

  if (rig.id === 'zuzu') {

    if (p.sandwich) { const sw = G(); sw.add(box(0.2, 0.08, 0.15, '#E9C98F')); sw.add(at(box(0.21, 0.025, 0.16, '#5FB04A'), 0, 0.0, 0)); sw.position.set(0, -0.05, 0.06); sw.rotation.set(0.2, 0, 1.3); rig.handR.add(sw); }
    if (p.packOff) {
      const pack = extra.pack; rig.torso.remove(pack); pack.position.set(0.62, 0.22, -0.55); pack.rotation.set(0, 0.3, -1.4); rig.groundItems.push(pack);
      pack.remove(extra.pan);
      rig.groundItems.push(at(cyl(0.06, 0.1, '#FFFAF0', 8), 0.85, 0.05, 0.25));
      const sw = box(0.18, 0.07, 0.15, '#E9C98F'); sw.position.set(0.68, 0.04, 0.6); sw.rotation.y = 0.6; rig.groundItems.push(sw);
      rig.groundItems.push(at(box(0.16, 0.025, 0.13, '#5FB04A'), 0.68, 0.085, 0.6));
    }
    if (p.panOnHead) { const pan = extra.pan; pan.rotation.set(0, 0, 0); const disc = pan.children[0]; disc.rotation.set(0, 0, 0.12); pan.children[1].position.set(0.32, 0.02, 0); pan.children[1].rotation.z = Math.PI / 2;
      pan.position.set(0.02, s.headR + 0.05, 0); pan.rotation.set(0.25, 0.4, -0.3); rig.head.add(pan);
      for (let i = 0; i < 3; i++) { const a = i * 2.1; const st = star(0.065, '#FFC83D', 0.03); st.position.set(Math.cos(a) * 0.32, s.headR + 0.24 + (i % 2) * 0.05, Math.sin(a) * 0.32); st.rotation.y = -a; rig.head.add(st); } }
  }
  // --- Tavo B
  if (rig.id === 'tavoB') {
    if (p.juice) { const j = juiceBox(); j.position.set(0, -0.1, 0.05); j.rotation.x = Math.PI; rig.handR.add(j); }
    if (p.coolerSeat) { const c = extra.cooler; rig.torso.remove(c); c.position.set(0, 0, -0.12); c.rotation.set(0, 0.0, 0); rig.groundItems.push(c); }
    if (p.coolerSpill) {
      const c = extra.cooler; rig.torso.remove(c); c.position.set(0.85, 0.0, -0.1); c.rotation.set(0, -0.5, 0); rig.groundItems.push(c);
      const lid = c.children[1]; c.remove(lid); lid.position.set(1.3, 0.05, 0.35); lid.rotation.set(0.2, 0.5, 0.35); rig.groundItems.push(lid);
      const seeds = [[0.2, 0.55], [0.45, 0.3], [0.6, 0.75], [-0.2, 0.7], [1.05, 0.55], [0.85, 0.85], [-0.45, 0.4], [0.4, 1.0]];
      seeds.forEach(([x, z], i) => rig.groundItems.push(rot(at(box(0.1, 0.1, 0.1, '#CDEFFF'), x, 0.04, z), 0, i * 37, 0)));
      rig.groundItems.push(rot(at(juiceBox('#FF8A3D'), 1.15, 0.0, 0.15), 90, 30, 0));
      rig.groundItems.push(rot(at(juiceBox('#5FC8FF'), 0.5, 0.0, -0.5), 0, 20, 0));
      { const j = juiceBox('#7BD45A'); j.scale.setScalar(1.4); rig.groundItems.push(at(j, -0.55, 0.0, 1.45)); } // the last one, just out of reach
    }
  }
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });

function lights(scene, rim) {
  scene.add(new THREE.HemisphereLight('#dff1ff', '#e3bf86', 1.5));
  const sun = new THREE.DirectionalLight('#fff2dc', 2.3); sun.position.set(-3, 6, 5); scene.add(sun);
  const r = new THREE.DirectionalLight(rim, 2.2); r.position.set(4, 3, -5); scene.add(r);
  const fill = new THREE.DirectionalLight('#ffffff', 0.5); fill.position.set(3, 1, 4); scene.add(fill);
}
function blob(parent, x = 0, rx = 0.6, z = 0) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(rx, 28), new THREE.MeshBasicMaterial({ color: '#3b2a10', transparent: true, opacity: 0.2, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0.002, z); m.scale.y = 0.6; parent.add(m);
}
function shot(scene, cam, w, h) { renderer.setSize(w, h, false); renderer.setClearColor(0x000000, 0); renderer.render(scene, cam); return renderer.domElement.toDataURL('image/png'); }
// one fighter in a pose, with its ground props, as a group turned by yaw
function posed(f, pose, yaw) {
  const g = G(); const rig = buildRig(f.id); applyPose(rig, POSES[f.id][pose]);
  const inner = G(); inner.add(rig.root); for (const o of rig.groundItems) inner.add(o);
  if (rig.root.userData.pz) rig.root.position.z -= rig.root.userData.pz;
  blob(inner, 0, f.id === 'ormo' ? 0.78 : 0.58);
  inner.rotation.y = yaw * D; g.add(inner); return g;
}
// frame any group: perspective camera fitted to its bounding box
function framed(group, w, h, { fov = 26, pad = 1.12, elev = 9, minH = 0 } = {}) {
  const scene = new THREE.Scene(); lights(scene, '#ffffff'); scene.add(group);
  group.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(group); const size = bb.getSize(new THREE.Vector3()); const c = bb.getCenter(new THREE.Vector3());
  const hh = Math.max(size.y, minH);
  const t = Math.tan(fov * D / 2); const asp = w / h;
  const dist = Math.max(hh / 2 / t, size.x / 2 / (t * asp)) * pad + size.z / 2;
  const cam = new THREE.PerspectiveCamera(fov, asp, 0.05, 80);
  cam.position.set(c.x, c.y + Math.sin(elev * D) * dist, c.z + Math.cos(elev * D) * dist); cam.lookAt(c);
  return shot(scene, cam, w, h);
}
function silhouette(f, yaw, pxPerM, colour = '#000000', hM = 2.4, wM = 1.6) {
  const scene = new THREE.Scene(); const rig = buildRig(f.id); applyPose(rig, POSES[f.id].idle);
  rig.root.rotation.y = yaw * D; scene.add(rig.root);
  scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: colour, side: THREE.DoubleSide });
  const w = Math.round(wM * pxPerM), h = Math.round(hM * pxPerM);
  const cam = new THREE.OrthographicCamera(-wM / 2, wM / 2, hM, 0, 0.1, 50); cam.position.set(0, 0, 10); cam.lookAt(0, 0, 0);
  return shot(scene, cam, w, h);
}

    <div class="poses">${['idle', 'victory', 'defeat', 'taunt'].map((p) => `<div class="pose"><div class="pic"><img data-pose="${p}" alt=""><div class="tag">${p.toUpperCase()}</div></div><p>${f.poses[p]}</p></div>`).join('')}</div>
    <div class="right">
      <div class="card"><div class="kicker">Personality</div><div class="big">${f.personality}</div><div class="quotes">${f.quotes.map((q) => `<span class="quote">${q}</span>`).join('')}</div></div>
      <div class="card trait"><div class="kicker">Signature trait idea</div><div class="big">${f.trait[0]}</div><div class="txt">${f.trait[1]}</div></div>
      <div class="card"><div class="kicker">Hook · silhouette test</div><div class="txt">${f.hook}</div>
        <div class="sil"><figure><img data-sil="front" alt="">front</figure><figure><img data-sil="side" alt="">side</figure>
          <div class="bgs"><div style="background:#efcf98"><img data-sil="c1" alt=""></div><div style="background:#6fbbe3"><img data-sil="c2" alt=""></div><div style="background:#1b1f2e"><img data-sil="c3" alt=""></div></div></div>
        <div class="txt" style="font-size:13px;color:#6b5a86;margin-top:2px">50 px/m ≈ the 1280×720 follow camera. Last three: flat accent on Offsite sand, sky, office.</div></div>
      <div class="card"><div class="kicker">Palette</div>
        <div class="swatches">${f.palette.map(([c]) => `<div class="sw" style="background:${c}"></div>`).join('')}</div>
        <div class="swatches" style="margin-top:4px">${f.palette.map(([c, n]) => `<div class="swl">${n}<br>${c}</div>`).join('')}</div></div>
    </div></section>`);
  root.appendChild(sec);
  sec.querySelector('.hero img').src = framed(posed(f, 'idle', YAW[f.id].hero), 760, 860, { fov: 13, pad: 1.1, elev: 7, minH: 2.1 });
  for (const img of sec.querySelectorAll('[data-pose]')) { const p = img.dataset.pose; img.src = framed(posed(f, p, YAW[f.id][p]), 300, 262, { fov: 28, pad: 1.1, elev: p === 'defeat' ? 22 : 8 }); }
  const s = (k) => sec.querySelector(`[data-sil="${k}"]`);
  s('front').src = silhouette(f, 0, PXM); s('side').src = silhouette(f, 90, PXM);
  for (const k of ['c1', 'c2', 'c3']) s(k).src = silhouette(f, -30, PXM, f.acc, 2.4, 1.52);
}

// overview
{
  const order = ['brix', 'margo', 'ormo', 'zuzu', 'tavoA', 'tavoB'];
  const F = Object.fromEntries(FIGHTERS.map((f) => [f.id, f]));
  const cx = [175, 480, 820, 1130, 1450, 1755];
  const sec = el(`<section class="sheet ov" id="sheet-overview">
    <div class="title">THE FOUR · v3</div>
    <div class="sub">R-022b · every one a fighter · R-024 IP pass: Ormo (silver quiff, walrus, argyle) and Brix (striped helmet, no stars) revised</div>
    <div class="lineup"><img alt=""></div>
    ${order.map((id, i) => `<div class="nm" style="left:${cx[i] - 150}px;--c:${F[id].acc}">${F[id].name}<small>${F[id].opt === 'OPTION A' || F[id].opt === 'OPTION B' ? F[id].opt.replace('OPTION ', '') + ' · ' : ''}${F[id].role}</small></div>`).join('')}
    <div class="groups">
      <div class="grp" style="left:${cx[0] - 150}px;width:${cx[1] - cx[0] + 300}px"><div class="br"></div><div class="lab">KESSA SLOT: PICK A OR B</div></div>
      <div class="grp" style="left:${cx[4] - 150}px;width:${cx[5] - cx[4] + 300}px"><div class="br"></div><div class="lab">TAVO: PICK A OR B</div></div>
    </div>
    <div class="dstrip"><div class="dhead">DEFEAT POSES</div><div class="dsub">each one tells a little story with a prop: read it at game scale, no text needed</div>
      <div class="dcards">${order.map((id) => `<div class="dc" style="--c:${F[id].acc}"><div class="pic"><img data-def="${id}" alt=""></div><div class="t">${F[id].name}${F[id].opt.startsWith('OPTION') ? ' ' + F[id].opt.slice(-1) : ''}</div><div class="d">${DEF_SHORT[id]}</div></div>`).join('')}</div></div>
    <div class="silrow">${order.map((id) => `<figure><img data-ovsil="${id}" alt=""><figcaption>${F[id].name}${F[id].opt.startsWith('OPTION') ? ' ' + F[id].opt.slice(-1) : ''}</figcaption></figure>`).join('')}</div>
  </section>`);
  root.appendChild(sec);
  // lineup: one ground, by slot, at true relative height
  const scene = new THREE.Scene(); lights(scene, '#ffffff');
  const W = 1920, H = 470, fov = 18, cam = new THREE.PerspectiveCamera(fov, W / H, 0.1, 80);
  const dist = 9.6; cam.position.set(0, 1.45, dist); cam.lookAt(0, 1.12, 0);
  const halfW = Math.tan(fov * D / 2) * (W / H) * dist;
  const yaws = { brix: 40, margo: 26, ormo: 12, zuzu: -6, tavoA: -26, tavoB: -36 };
  order.forEach((id, i) => { const x = (cx[i] / W * 2 - 1) * halfW; const g = posed(F[id], 'idle', yaws[id]); g.position.x = x; scene.add(g); });
  sec.querySelector('.lineup img').src = shot(scene, cam, W, H);
  for (const id of order) sec.querySelector(`[data-def="${id}"]`).src = framed(posed(F[id], 'defeat', YAW[id].defeat), 290, 232, { fov: 28, pad: 1.08, elev: 22 });
  for (const id of order) sec.querySelector(`[data-ovsil="${id}"]`).src = silhouette(F[id], -30, 32, '#000', 2.36, 1.5);
}
document.body.dataset.ready = '1';
</script>
