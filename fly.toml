# Floor 42 game server on Fly.io. One small machine that stops when nobody plays.
app = "floor42-game"
primary_region = "fra"

[build]
  dockerfile = "server/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Multi-region (not enabled; docs/TECHNICAL.md, "Regions"): one app per region from this same file, e.g.
#   fly deploy --app floor42-game-iad --primary-region iad --ha=false
# with MULTI_REGION=1 set as a secret/env on each app. Keep min_machines_running = 1 in the primary
# only if the cold start (a few seconds to wake a stopped machine) is unwanted; it is a fixed cost.
