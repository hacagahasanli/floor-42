<!doctype html>
<html lang="en" class="font-sans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F1E" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <title>Floor 42</title>
    <link rel="preload" href="./menu-poster.webp" as="image" type="image/webp" />
    <meta name="description" content="A two-player office shootout: settle it on floor 42, first to five KOs." />
    <!-- CrazyGames SDK v3. If it cannot load (offline, another portal), the game runs without it. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <style>
      html,body{margin:0;height:100%;background:#0a0d18}
      /* The boot screen: the logo and a bar, up from the first paint until the first screen has drawn. Only transform and opacity animate. */
      #boot{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#0a0d18 url(./menu-poster.webp) center/cover}
      /* The menu's backdrop as a still from the first paint; a scrim keeps the logo readable. */
      #boot::before{content:'';position:absolute;inset:0;background:rgba(10,13,24,.62)}
      #boot>*{position:relative}
      #boot img{width:min(420px,70vw);height:auto}
      #boot .bar{position:relative;width:min(280px,60vw);height:6px;overflow:hidden;background:rgba(230,235,245,.14)}
      #boot .bar i{position:absolute;inset:0;background:#ffd23f;transform-origin:0 50%;animation:bootBar 1.4s ease-in-out infinite}
      @keyframes bootBar{0%{transform:translateX(-100%) scaleX(.4)}100%{transform:translateX(100%) scaleX(.4)}}
      @media (prefers-reduced-motion:reduce){#boot .bar i{animation:none;transform:scaleX(.5)}}
    </style>
  </head>
  <body class="font-sans">
    <div id="boot" role="status" aria-label="Loading"><img src="./brand/logo.svg" alt="Floor 42" width="1078" height="270" /><div class="bar"><i></i></div></div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
